# Throwaway test stack for the IBKR curves: own database, mock IBKR data,
# read-only real model files. Not for production.
#   docker compose -p orch-ibkr-test -f docker-compose.ibkr-test.yaml up -d --build
name: orch-ibkr-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

  stock_portfolio_api:
    build: ./stock_portfolio_api
    image: stock_portfolio_api:ibkr-test
    environment:
      STOCKS_DATA_PATH: /app/stocks_data.csv
      MODELS_OUTPUT_DIR: /app/models_output_json
      VISITS_DATA_PATH: /app/data/visits.json
      DATABASE_URL: postgresql://test:test-only-password@postgres:5432/test
      SECRET_KEY: test-only-secret
      # real IBKR paper returns, straight from the trader's log
      IBKR_RETURNS_PATH: /app/ibkr/real_returns.csv
    volumes:
      - /home/ken/git/orch/models_output_json:/app/models_output_json:ro
      - /home/ken/git/orch/stocks_data.csv:/app/stocks_data.csv:ro
      - /home/ken/git/ibkr-trader/logs:/app/ibkr:ro
      - ./test-data:/app/data
    ports:
      - "5101:5001"
    depends_on:
      postgres:
        condition: service_healthy

  stock_ai_dashboard:
    build: ./stock-ai-dashboard
    image: stock-ai-dashboard:ibkr-test
    depends_on:
      - stock_portfolio_api
    ports:
      - "5273:80"
